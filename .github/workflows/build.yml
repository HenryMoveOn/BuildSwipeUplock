name: Build HomeBarURL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (roothide)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/install.log"
          : > "$LOG"
          echo "### attempt: install-theos (authenticated)" >> "$LOG"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)" >> "$LOG" 2>&1
          rc=$?
          echo "install-theos rc=$rc" >> "$LOG"
          if [ "$rc" -ne 0 ] || [ -z "$(ls -d "$HOME/theos/sdks"/iPhoneOS*.sdk 2>/dev/null)" ]; then
            echo "### fallback: manual setup" >> "$LOG"
            brew install ldid xz >> "$LOG" 2>&1
            [ -d "$HOME/theos" ] || git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos" >> "$LOG" 2>&1
            rm -rf "$HOME/theos/sdks"
            mkdir -p "$HOME/theos/sdks"
            "$HOME/theos/bin/install-sdk" latest >> "$LOG" 2>&1
          fi
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            echo "### ensure iPhoneOS16.5 sdk explicitly" >> "$LOG"
            "$HOME/theos/bin/install-sdk" iPhoneOS16.5 >> "$LOG" 2>&1 || true
          fi
          echo "=== sdks ===" >> "$LOG"
          ls -la "$HOME/theos/sdks" >> "$LOG" 2>&1
          echo "=== toolchain ===" >> "$LOG"
          ls "$HOME/theos/toolchain" >> "$LOG" 2>&1
          SDK_DIR="$(ls -d "$HOME/theos/sdks"/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDK_DIR" ]; then
            echo "INSTALL FAILED: no iPhoneOS sdk" >> "$LOG"
            exit 1
          fi
          SDK_VER="$(basename "$SDK_DIR" .sdk)"
          SDK_VER="${SDK_VER#iPhoneOS}"
          echo "using SDK: $SDK_VER" >> "$LOG"
          echo "SDKTARGET=iphone:clang:$SDK_VER:15.0" >> "$GITHUB_ENV"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Ensure GNU make
        run: |
          MAKE_BIN="$(brew --prefix)/opt/make/bin/gmake"
          if [ ! -x "$MAKE_BIN" ]; then
            brew install make 2>&1 | tee "$GITHUB_WORKSPACE/brew-make.log" || true
          fi
          if [ -x "$MAKE_BIN" ]; then
            "$MAKE_BIN" --version 2>/dev/null | head -1 | tee "$GITHUB_WORKSPACE/make-version.txt" || true
          else
            echo "GMAKE MISSING - will fall back to system make" | tee "$GITHUB_WORKSPACE/make-version.txt" || true
          fi

      - name: Generate tweak project
        run: |
          mkdir -p HomeBarURL/HomeBarURLPrefs/Resources
          mkdir -p HomeBarURL/HomeBarURLPrefs/layout/Library/PreferenceLoader/Preferences
          cd HomeBarURL
          cat > Makefile <<'EOF_MAKEFILE'
          SDKTARGET ?= iphone:clang:16.5:15.0
          TARGET := $(SDKTARGET)
          ARCHS = arm64e
          THEOS_PACKAGE_SCHEME = roothide

          include $(THEOS)/makefiles/common.mk

          SUBPROJECTS += HomeBarURLPrefs

          TWEAK_NAME = HomeBarURL
          HomeBarURL_FILES = Tweak.xm
          HomeBarURL_CFLAGS = -fobjc-arc -Wno-error
          HomeBarURL_FRAMEWORKS = UIKit

          include $(THEOS_MAKE_PATH)/tweak.mk
          include $(THEOS_MAKE_PATH)/aggregate.mk
          EOF_MAKEFILE
          cat > control <<'EOF_CONTROL'
          Package: com.yourname.homebarurl
          Name: HomeBarURL
          Version: 1.2.2
          Architecture: iphoneos-arm64e
          Description: Tap the home indicator anywhere to open a configurable URL. Configure it in Settings.
          Maintainer: qweasdhxy
          Author: qweasdhxy
          Section: Tweaks
          Depends: mobilesubstrate, preferenceloader
          EOF_CONTROL
          cat > HomeBarURL.plist <<'EOF_FILTER'
          {
              Filter = {
                  Frameworks = ( "UIKit" );
              };
          }
          EOF_FILTER
          cat > Tweak.xm <<'EOF_TWEAK'
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          static NSString * const kSuiteName = @"com.yourname.homebarurl";
          static NSString * const kURLKey = @"targetURL";

          @interface UIView (HomeBarURL)
          - (void)hburl_handleTap;
          @end

          %hook UIView

          - (void)didMoveToWindow {
              %orig;

              if (!self.window) return;

              // 真正的小白条视图是 MaterialKit 的 MTLumaDodgePillView
              // SpringBoard 和所有 App 里都是这一个类
              NSString *cls = NSStringFromClass(self.class);
              if (![cls containsString:@"LumaDodgePill"]) return;

              static char kGestureAddedKey;
              if (objc_getAssociatedObject(self, &kGestureAddedKey)) return;

              self.userInteractionEnabled = YES;
              UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc]
                  initWithTarget:self
                  action:@selector(hburl_handleTap)];
              tap.numberOfTapsRequired = 1;
              tap.cancelsTouchesInView = NO;
              [self addGestureRecognizer:tap];

              objc_setAssociatedObject(self, &kGestureAddedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
          }

          %new
          - (void)hburl_handleTap {
              NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:kSuiteName];
              NSString *urlString = [defaults stringForKey:kURLKey];
              if (!urlString || urlString.length == 0) {
                  urlString = @"https://www.example.com";
              }
              NSURL *url = [NSURL URLWithString:urlString];
              if (url) {
                  [[UIApplication sharedApplication] openURL:url options:@{} completionHandler:nil];
              }
          }

          %end
          EOF_TWEAK
          cat > HomeBarURLPrefs/Makefile <<'EOF_PREFMAKE'
          BUNDLE_NAME = HomeBarURLPrefs

          HomeBarURLPrefs_FILES = HomeBarURLPrefs.m
          HomeBarURLPrefs_INSTALL_PATH = /Library/PreferenceBundles
          HomeBarURLPrefs_FRAMEWORKS = UIKit
          HomeBarURLPrefs_PRIVATE_FRAMEWORKS = Preferences

          include $(THEOS)/makefiles/common.mk
          include $(THEOS_MAKE_PATH)/bundle.mk
          EOF_PREFMAKE
          cat > HomeBarURLPrefs/HomeBarURLPrefs.m <<'EOF_PREFM'
          #import <Preferences/PSListController.h>
          #import <Preferences/PSSpecifier.h>

          @interface HomeBarURLPrefsListController : PSListController
          @end

          @implementation HomeBarURLPrefsListController

          // 代码动态构造界面，完全不依赖 plist 文件，保证一定有内容
          - (NSArray *)hb_buildSpecifiers {
              NSMutableArray *specs = [NSMutableArray array];

              PSSpecifier *group = [PSSpecifier preferenceSpecifierNamed:@"点击小白条打开"
                  target:self set:NULL get:NULL detail:Nil cell:PSGroupCell edit:Nil];
              [group setProperty:@"输入完整网址（必须包含 http:// 或 https://），修改后无需重启，点击小白条立即生效。"
                         forKey:@"footerText"];
              [specs addObject:group];

              PSSpecifier *urlSpec = [PSSpecifier preferenceSpecifierNamed:@"目标网址"
                  target:self
                  set:@selector(setPreferenceValue:specifier:)
                  get:@selector(readPreferenceValue:)
                  detail:Nil
                  cell:PSEditTextCell
                  edit:Nil];
              [urlSpec setProperty:@"com.yourname.homebarurl" forKey:@"defaults"];
              [urlSpec setProperty:@"targetURL" forKey:@"key"];
              [urlSpec setProperty:@"https://www.example.com" forKey:@"default"];
              [urlSpec setProperty:@"https://" forKey:@"placeholder"];
              [urlSpec setProperty:@2 forKey:@"keyboardType"];
              [urlSpec setProperty:@0 forKey:@"autocapitalizationType"];
              [urlSpec setProperty:@0 forKey:@"autocorrectionType"];
              [specs addObject:urlSpec];

              return specs;
          }

          - (NSArray *)specifiers {
              NSArray *list = nil;
              @try {
                  list = [self loadSpecifiersFromPlistName:@"Root" target:self];
              } @catch (NSException *e) {
                  list = nil;
              }
              if (!list || [list count] == 0) {
                  list = [self hb_buildSpecifiers];
              }
              return list;
          }

          @end
          EOF_PREFM
          cat > HomeBarURLPrefs/Resources/Root.plist <<'EOF_ROOT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>title</key>
              <string>HomeBarURL</string>
              <key>items</key>
              <array>
                  <dict>
                      <key>cell</key>
                      <string>PSGroupCell</string>
                      <key>label</key>
                      <string>点击小白条打开</string>
                  </dict>
                  <dict>
                      <key>cell</key>
                      <string>PSTextFieldCell</string>
                      <key>label</key>
                      <string>目标网址</string>
                      <key>key</key>
                      <string>targetURL</string>
                      <key>defaults</key>
                      <string>com.yourname.homebarurl</string>
                      <key>id</key>
                      <string>targetURL</string>
                      <key>default</key>
                      <string>https://www.example.com</string>
                      <key>placeholder</key>
                      <string>https://</string>
                      <key>autocapitalizationType</key>
                      <integer>0</integer>
                      <key>autocorrectionType</key>
                      <integer>0</integer>
                      <key>keyboardType</key>
                      <integer>2</integer>
                  </dict>
                  <dict>
                      <key>cell</key>
                      <string>PSGroupCell</string>
                      <key>footerText</key>
                      <string>输入完整网址（必须包含 http:// 或 https://），修改后无需重启，点击小白条立即生效。</string>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF_ROOT
          cat > HomeBarURLPrefs/Resources/Info.plist <<'EOF_INFO'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>HomeBarURLPrefs</string>
              <key>CFBundleIdentifier</key>
              <string>com.yourname.homebarurl.prefs</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>HomeBarURL</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.2.2</string>
              <key>CFBundleVersion</key>
              <string>1.2.2</string>
              <key>NSPrincipalClass</key>
              <string>HomeBarURLPrefsListController</string>
          </dict>
          </plist>
          EOF_INFO
          cat > HomeBarURLPrefs/layout/Library/PreferenceLoader/Preferences/HomeBarURLPrefs.plist <<'EOF_ENTRY'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>entry</key>
              <dict>
                  <key>bundle</key>
                  <string>HomeBarURLPrefs</string>
                  <key>cell</key>
                  <string>PSLinkCell</string>
                  <key>detail</key>
                  <string>HomeBarURLPrefsListController</string>
                  <key>isController</key>
                  <integer>1</integer>
                  <key>icon</key>
                  <string>HomeBarURL.png</string>
                  <key>label</key>
                  <string>HomeBarURL</string>
              </dict>
          </dict>
          </plist>
          EOF_ENTRY
