          tr -d ' \t\n' < HomeBarURLPrefs/layout/Library/PreferenceLoader/Preferences/HomeBarURL.png.b64 | python3 -m base64 -d > "$ICONSRC"
          rm -f HomeBarURLPrefs/layout/Library/PreferenceLoader/Preferences/HomeBarURL.png.b64
          echo "source icon: $(sips -g pixelWidth -g pixelHeight "$ICONSRC" 2>/dev/null | tr '\n' ' ')"

          # 设置里图标的标准尺寸是 29pt：@1x 29px / @2x 58px / @3x 87px
          # 之前直接塞 120px（甚至 58px）会被当成 @1x 渲染成 58~120pt，所以「图标太大」
          PLIST_DIR="HomeBarURLPrefs/layout/Library/PreferenceLoader/Preferences"
          BUNDLE_DIR="HomeBarURLPrefs/layout/Library/PreferenceBundles/HomeBarURLPrefs.bundle"
          mkdir -p "$BUNDLE_DIR"

          for spec in "HomeBarURL.png:29" "HomeBarURL@2x.png:58" "HomeBarURL@3x.png:87"; do
            name="${spec%%:*}"
            size="${spec##*:}"
            if ! sips -z "$size" "$size" "$ICONSRC" --out "/tmp/$name" >/dev/null 2>&1; then
              cp "$ICONSRC" "/tmp/$name"
            fi
            cp "/tmp/$name" "$PLIST_DIR/$name"
            cp "/tmp/$name" "$BUNDLE_DIR/$name"
            echo "$name -> $(wc -c < "$PLIST_DIR/$name") bytes"
          done
          rm -f "$PLIST_DIR/HomeBarURL.png.b64"

          echo "=== icon size self-check (expect 29 / 58 / 87 px) ==="
          for name in HomeBarURL.png HomeBarURL@2x.png HomeBarURL@3x.png; do
            dim="$(sips -g pixelWidth -g pixelHeight "$BUNDLE_DIR/$name" 2>/dev/null \
                   | grep -E 'pixel(Width|Height)' | awk '{print $2}' | paste -sd 'x' -)"
            echo "  $name : ${dim:-unknown}"
          done
          echo "=== icon files ==="
          ls -la "$BUNDLE_DIR"

      - name: Preflight check
        run: |
          set +e
          echo "===== PREFLIGHT ====="
          cd "$GITHUB_WORKSPACE/HomeBarURL"
          bad=0
          if command -v plutil >/dev/null 2>&1; then
            for p in $(find . -name '*.plist' 2>/dev/null); do
              plutil -lint "$p" || { echo "!!! BAD PLIST: $p"; bad=1; }
            done
          else
            echo "(plutil unavailable, skip plist lint)"
          fi
          cat > /tmp/hbcheck.py <<'PYCHK'
          import re, sys
          ok = True
          for f in ('Tweak.xm', 'HomeBarURLPrefs/HomeBarURLPrefs.m'):
              try:
                  t = open(f, encoding='utf-8').read()
              except Exception as e:
                  print('!!! MISSING', f, e); ok = False; continue
              s = re.sub(r'@"(\\.|[^"\\])*"', '""', t)
              s = re.sub(r'/\*.*?\*/', '', s, flags=re.S)
              s = '\n'.join(re.sub(r'//.*$', '', l) for l in s.split('\n'))
              depth = 0
              for i, l in enumerate(s.split('\n'), 1):
                  t2 = l.strip()
                  if t2.startswith(('@interface', '@implementation', '@protocol')):
                      depth += 1
                  elif t2 == '@end':
                      depth -= 1
                      if depth < 0:
                          print('!!! EXTRA @end at line', i, 'in', f); ok = False; break
              if depth > 0:
                  print('!!! UNCLOSED @interface/@implementation in', f, 'depth', depth); ok = False
              if s.count('{') != s.count('}'):
                  print('!!! BRACE MISMATCH', f, s.count('{'), s.count('}')); ok = False
              if s.count('(') != s.count(')'):
                  print('!!! PAREN MISMATCH', f, s.count('('), s.count(')')); ok = False
              print('checked', f)
          sys.exit(0 if ok else 1)
          PYCHK
          python3 /tmp/hbcheck.py
          [ $? -eq 0 ] || bad=1
          echo "preflight bad=$bad"
          if [ "$bad" -ne 0 ]; then
            echo "===== PREFLIGHT FAILED ====="
            exit 1
          fi
          echo "===== PREFLIGHT OK ====="

      - name: Build deb
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          MAKE_BIN="$(brew --prefix)/opt/make/bin/gmake"
          if [ ! -x "$MAKE_BIN" ]; then
            echo "!!! gmake missing at build time" | tee build.log
            MAKE_BIN="make"
          fi
          {
            echo "===== DIAG ====="
            echo "SDKTARGET=${SDKTARGET:-unset}"
            echo "make: $("$MAKE_BIN" --version 2>/dev/null | head -1)"
            ls -d "$THEOS/sdks"/iPhoneOS*.sdk 2>/dev/null || true
            clang --version 2>&1 | head -2 || true
            ls "$THEOS/toolchain" 2>/dev/null || true
            echo "===== MAKE ====="
          } 2>&1 | tee -a build.log
          cd HomeBarURL
          "$MAKE_BIN" package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee -a ../build.log

      - name: Save build log to ci-log branch
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "===== META ====="
            echo "run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA build_outcome=${{ steps.build.outcome }}"
            echo
            echo "===== MAKE VERSION ====="
            cat make-version.txt 2>/dev/null
            echo
            echo "===== BREW MAKE LOG TAIL (20) ====="
            tail -n 20 brew-make.log 2>/dev/null
            echo
            echo "===== DEB PRODUCED? ====="
            ls -la HomeBarURL/packages/ 2>/dev/null || true
            echo
            echo "===== DEB CONTENTS (files actually inside .deb) ====="
            for d in HomeBarURL/packages/*.deb; do
              [ -e "$d" ] && { echo ">> $d"; dpkg-deb -c "$d" 2>/dev/null | sed 's#^#  #'; } || true
            done
            echo
            echo "===== KEY FILES IN BUILD TREE ====="
            find HomeBarURL \( -name '*.bundle' -o -name 'HomeBarURLPrefs.plist' -o -name 'HomeBarURL*.png' -o -name 'Root.plist' \) 2>/dev/null | sed 's#^#  #' || true
            echo
            echo "===== INSTALL LOG TAIL (60) ====="
            tail -n 60 install.log 2>/dev/null || true
            echo
            echo "===== BUILD LOG (last 150 lines) ====="
            tail -n 150 build.log 2>/dev/null || true
          } > build-log.txt
          wc -c build-log.txt
          B64="$(base64 < build-log.txt | tr -d '\n')"
          SHA="$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-log.txt?ref=ci-log" \
            | grep '"sha"' | head -1 | sed -E 's/.*"sha": *"([^"]+)".*/\1/')"
          if [ -n "$SHA" ]; then
            PAYLOAD="{\"message\":\"ci log [skip ci]\",\"content\":\"$B64\",\"branch\":\"ci-log\",\"sha\":\"$SHA\"}"
          else
            PAYLOAD="{\"message\":\"ci log [skip ci]\",\"content\":\"$B64\",\"branch\":\"ci-log\"}"
          fi
          curl -sS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/build-log.txt" \
            -d "$PAYLOAD" | head -c 500 || true

      - name: Upload deb
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HomeBarURL-deb
          path: HomeBarURL/packages/*.deb

      - name: Publish release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: HomeBarURL build ${{ github.run_number }}
          files: HomeBarURL/packages/*.deb

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "==================== BUILD FAILED ===================="
          echo "----- last 120 lines of build.log -----"
          tail -n 120 build.log 2>/dev/null || echo "(no build.log)"
          echo "----- deb produced? -----"
          ls -la HomeBarURL/packages/ 2>/dev/null || echo "(no packages dir)"
          echo "======================================================"
          exit 1
