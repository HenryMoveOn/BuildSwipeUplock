name: Build HomeBarURL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (roothide)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/install.log"
          : > "$LOG"
          echo "### attempt: install-theos (authenticated)" >> "$LOG"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)" >> "$LOG" 2>&1
          rc=$?
          echo "install-theos rc=$rc" >> "$LOG"
          if [ "$rc" -ne 0 ] || [ -z "$(ls -d "$HOME/theos/sdks"/iPhoneOS*.sdk 2>/dev/null)" ]; then
            echo "### fallback: manual setup" >> "$LOG"
            brew install ldid xz >> "$LOG" 2>&1
            [ -d "$HOME/theos" ] || git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos" >> "$LOG" 2>&1
            rm -rf "$HOME/theos/sdks"
            mkdir -p "$HOME/theos/sdks"
            "$HOME/theos/bin/install-sdk" latest >> "$LOG" 2>&1
          fi
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            echo "### ensure iPhoneOS16.5 sdk explicitly" >> "$LOG"
            "$HOME/theos/bin/install-sdk" iPhoneOS16.5 >> "$LOG" 2>&1 || true
          fi
          echo "=== sdks ===" >> "$LOG"
          ls -la "$HOME/theos/sdks" >> "$LOG" 2>&1
          echo "=== toolchain ===" >> "$LOG"
          ls "$HOME/theos/toolchain" >> "$LOG" 2>&1
          SDK_DIR="$(ls -d "$HOME/theos/sdks"/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDK_DIR" ]; then
            echo "INSTALL FAILED: no iPhoneOS sdk" >> "$LOG"
            exit 1
          fi
          SDK_VER="$(basename "$SDK_DIR" .sdk)"
          SDK_VER="${SDK_VER#iPhoneOS}"
          echo "using SDK: $SDK_VER" >> "$LOG"
          echo "SDKTARGET=iphone:clang:$SDK_VER:15.0" >> "$GITHUB_ENV"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Ensure GNU make
        run: |
          MAKE_BIN="$(brew --prefix)/opt/make/bin/gmake"
          if [ ! -x "$MAKE_BIN" ]; then
            brew install make 2>&1 | tee "$GITHUB_WORKSPACE/brew-make.log" || true
          fi
          if [ -x "$MAKE_BIN" ]; then
            "$MAKE_BIN" --version 2>/dev/null | head -1 | tee "$GITHUB_WORKSPACE/make-version.txt" || true
          else
            echo "GMAKE MISSING - will fall back to system make" | tee "$GITHUB_WORKSPACE/make-version.txt" || true
          fi

      - name: Generate tweak project
        run: |
          mkdir -p HomeBarURL/HomeBarURLPrefs/Resources
          mkdir -p HomeBarURL/HomeBarURLPrefs/layout/Library/PreferenceLoader/Preferences
          cd HomeBarURL
          cat > Makefile <<'EOF_MAKEFILE'
          SDKTARGET ?= iphone:clang:16.5:15.0
          TARGET := $(SDKTARGET)
          ARCHS = arm64e
          THEOS_PACKAGE_SCHEME = roothide

          include $(THEOS)/makefiles/common.mk

          SUBPROJECTS += HomeBarURLPrefs

          TWEAK_NAME = HomeBarURL
          HomeBarURL_FILES = Tweak.xm
          HomeBarURL_CFLAGS = -fobjc-arc -Wno-error -Wno-deprecated-declarations -Wno-unused-const-variable -Wno-unused-function
          HomeBarURL_FRAMEWORKS = UIKit QuartzCore CoreGraphics

          include $(THEOS_MAKE_PATH)/tweak.mk
          include $(THEOS_MAKE_PATH)/aggregate.mk
          EOF_MAKEFILE
          cat > control <<'EOF_CONTROL'
          Package: com.yourname.homebarurl
          Name: HomeBarURL
          Version: 2.0.4
          Architecture: iphoneos-arm64e
          Description: Tap the home indicator anywhere to open a configurable URL. Configure it in Settings.
          Maintainer: qweasdhxy
          Author: qweasdhxy
          Section: Tweaks
          Depends: mobilesubstrate, preferenceloader
          EOF_CONTROL
          cat > HomeBarURL.plist <<'EOF_FILTER'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <!--
                    只注入 SpringBoard，不注入任何其他进程。
                    ElleKit（Dopamine roothide 的注入框架）只识别
                    Bundles / Classes / Executables / CoreFoundationVersion 四种键，
                    完全不读 Frameworks —— 用 Frameworks 会导致 dylib 永远不被注入。
                    这里只用 Bundles 精确命中 SpringBoard；
                    绝不能再加 Classes（那会把 dylib 塞进每一个加载了 UIKit 的进程）。
                  -->
                  <key>Bundles</key>
                  <array>
                      <string>com.apple.springboard</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF_FILTER
          cat > Tweak.xm <<'EOF_TWEAK'
          #import <UIKit/UIKit.h>
          #import <CoreFoundation/CoreFoundation.h>
          #import <objc/runtime.h>

          /*
           * HomeBarURL 2.0.4
           *
           * 2.0.4：填充与边框透明度各新增 0.1%（0.001）一档，位于 0.01% 与 1% 之间。
           *   **关键修复：2.0.3 漏了 bump 版本号**，包版本与 BUILD STAMP 都仍是 2.0.3。
           *   APT 见到「同版本已安装」就不会替换 dylib —— 于是设置面板是新的（能看到新档位），
           *   但真机上跑的还是旧 dylib（外观逻辑停留在把透明度直接写在命中层的旧版本），
           *   表现就是「调到极低透明度后点击小白条没反应」。以后每版必须 bump 版本号。
           * 2.0.3：填充透明度新增 0.01 档；**边框透明度独立成一项** overlayBorderOpacity（默认 0.00 = 无边框）；
           *   启动日志加 [BUILD STAMP]，便于确认真机实际运行的版本。
           * 2.0.2：新增**独立显示层** HBTintView，命中层与显示层彻底分离 ——
           *   颜色/透明度只写显示层，命中层永远是 clear + 无边框，
           *   于是「透明度调 0」不再影响点击。同时去掉触发区边框。
           * 2.0.1：透明度新增 0%（完全透明，仍可点击）与 5% 两档；
           *   边框颜色不再单列，直接跟随「区域颜色」+「区域透明度」，与填充同色同透明度。
           *
           * 2.0.0 三条硬性约束（按用户要求彻底简化）：
           *   1) 只注入 SpringBoard：Filter 里只剩 Bundles = com.apple.springboard，
           *      不再使用 Classes（那会把 dylib 塞进每一个加载了 UIKit 的进程）。
           *   2) 全局只有「一层」触发区：只挂在自建的 HBPassWindow 上。
           *      之前同时挂了「独立窗口层」+「keyWindow 层」，于是出现两层红色半透明叠在一起。
           *   3) 「显示触发区」关闭时必须完全不可见：背景 clear、无边框；
           *      同时 hidden/alpha/userInteractionEnabled 一律保持可命中，关掉外观不影响点击。
           *
           * 触发原理：
           *   - 小白条本体（MTLumaDodgePillView）只有 ~5pt 高，手指几乎不可能命中，
           *     且它可能位于系统窗口、祖先视图 userInteractionEnabled=NO，
           *     UIKit 的 hitTest 根本不会把触摸派发给它。
           *   - 因此改为自建一个透明穿透窗口，在其底部放一块触发区：
           *     hitTest 只吃「触发区内」的点，其余一律返回 nil 交回下层窗口。
           *   - 触发区默认贴底、水平居中，宽约 136pt、高 34pt（= 底部安全区），
           *     正好覆盖小白条所在的那一整行。
           *   - 0.4s 内去重，避免重复打开。
           */

          static NSString * const HBID     = @"com.yourname.homebarurl";
          static NSString * const kURLKey  = @"targetURL";
          static NSString * const kOnKey   = @"enabled";
          static NSString * const kActKey  = @"activation";   // 0=单击 1=双击 2=长按
          static NSString * const kWKey    = @"triggerWidth";   // 触发区宽(pt)，0=跟随底部安全区
          static NSString * const kHKey    = @"triggerHeight";  // 触发区高(pt)，0=跟随底部安全区
          static NSString * const kDyKey   = @"triggerOffsetY"; // 相对默认位置上下微调(pt)
          static NSString * const kOvKey   = @"showOverlay";    // 是否显示触发区
          static NSString * const kClKey   = @"overlayColor";   // 触发区颜色
          static NSString * const kOpKey   = @"overlayOpacity"; // 触发区(填充)透明度 0~1
          static NSString * const kOpBKey  = @"overlayBorderOpacity"; // 触发区边框透明度 0~1
          static NSString * const kDbgKey  = @"debugEnabled";
          static NSString * const kKbKey   = @"disableWithKeyboard";
          static NSString * const kHapKey  = @"haptic";

          // 遥测键：写进偏好域，设置面板里直接可见，不需要 Filza
          static NSString * const kDiagLoad    = @"diagLoad";
          static NSString * const kDiagOverlay = @"diagOverlay";
          static NSString * const kDiagFire    = @"diagFire";

          static NSString * const kDefaultURL = @"taplink://trigger/DA426593-2DD3-4759-B23A-3ADB84B46213";

          // 唯一权威来源：新增任何偏好键都必须加到这里，否则永远读不到（会静默回落默认值）
          static NSArray *HBPrefKeys(void) {
              return @[kURLKey, kOnKey, kActKey, kWKey, kHKey, kDyKey,
                       kOvKey, kClKey, kOpKey, kOpBKey, kDbgKey, kKbKey, kHapKey];
          }

          static BOOL      gDebug   = YES;
          static NSString *gLogPath = nil;
          static NSDate   *gLastFire = nil;

          /* ---------------- 日志 ---------------- */

          static void HBLog(NSString *fmt, ...) {
              if (!gDebug) return;
              va_list args;
              va_start(args, fmt);
              NSString *msg = [[NSString alloc] initWithFormat:fmt arguments:args];
              va_end(args);
              NSLog(@"[HomeBarURL] %@", msg);
              if (!gLogPath) return;
              @try {
                  NSString *line = [NSString stringWithFormat:@"%@ %@\n", [NSDate date], msg];
                  NSFileHandle *h = [NSFileHandle fileHandleForWritingAtPath:gLogPath];
                  if (h) {
                      [h seekToEndOfFile];
                      [h writeData:[line dataUsingEncoding:NSUTF8StringEncoding]];
                      [h closeFile];
                  } else {
                      [line writeToFile:gLogPath atomically:YES encoding:NSUTF8StringEncoding error:NULL];
                  }
              } @catch (NSException *e) {}
          }

          /* ---------------- 遥测（写进偏好域，设置面板可直读） ---------------- */

          static NSString *HBTime(void) {
              NSDateFormatter *f = [[NSDateFormatter alloc] init];
              f.dateFormat = @"MM-dd HH:mm:ss";
              return [f stringFromDate:[NSDate date]];
          }

          static void HBSetDiag(NSString *key, NSString *value) {
              if (!key || !value) return;
              @try {
                  CFPreferencesSetAppValue((__bridge CFStringRef)key,
                                           (__bridge CFPropertyListRef)value,
                                           (__bridge CFStringRef)HBID);
                  CFPreferencesAppSynchronize((__bridge CFStringRef)HBID);
              } @catch (NSException *e) {}
          }

          /* ---------------- 读取偏好（三层兜底） ---------------- */

          static NSDictionary *HBPrefs(void) {
              CFStringRef app = (__bridge CFStringRef)HBID;
              CFPreferencesAppSynchronize(app);

              NSArray *keys = HBPrefKeys();
              NSMutableDictionary *m = [NSMutableDictionary dictionary];

              for (NSString *k in keys) {
                  id v = (__bridge_transfer id)CFPreferencesCopyAppValue((__bridge CFStringRef)k, app);
                  if (v) m[k] = v;
              }

              if (m.count == 0) {
                  @try {
                      NSUserDefaults *ud = [[NSUserDefaults alloc] initWithSuiteName:HBID];
                      NSDictionary *dr = [ud dictionaryRepresentation];
                      for (NSString *k in keys) { id v = dr[k]; if (v) m[k] = v; }
                  } @catch (NSException *e) {}
              }

              if (m.count == 0) {
                  @try {
                      NSString *path = [NSString stringWithFormat:@"/var/mobile/Library/Preferences/%@.plist", HBID];
                      NSDictionary *f = [NSDictionary dictionaryWithContentsOfFile:path];
                      for (NSString *k in keys) { id v = f[k]; if (v) m[k] = v; }
                  } @catch (NSException *e) {}
              }

              return m;
          }

          static BOOL HBBool(NSDictionary *p, NSString *k, BOOL def) {
              id v = p[k];
              return [v respondsToSelector:@selector(boolValue)] ? [v boolValue] : def;
          }

          static CGFloat HBNum(NSDictionary *p, NSString *k, CGFloat def) {
              id v = p[k];
              return [v respondsToSelector:@selector(floatValue)] ? [v floatValue] : def;
          }

          static NSString *HBStr(NSDictionary *p, NSString *k, NSString *def) {
              id v = p[k];
              if (![v isKindOfClass:[NSString class]]) return def;
              return ([(NSString *)v length] > 0) ? (NSString *)v : def;
          }

          /* ---------------- 透明触发层 ---------------- */

          @interface HBTriggerView : UIView
          @property (nonatomic, assign) CGFloat   activeWidth;    // 0 = 整层可点
          @property (nonatomic, assign) BOOL      captureEnabled;
          @property (nonatomic, assign) NSInteger modeTag;        // 当前手势模式，避免重复重建
          @end

          @implementation HBTriggerView

          - (instancetype)initWithFrame:(CGRect)frame {
              if ((self = [super initWithFrame:frame])) {
                  self.backgroundColor    = [UIColor clearColor];
                  self.opaque             = NO;
                  self.userInteractionEnabled = YES;
                  self.captureEnabled     = YES;
                  self.activeWidth        = 0.0;
                  self.modeTag            = -1;
                  self.autoresizingMask   = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleTopMargin;
              }
              return self;
          }

          // 只吃「底部居中」的一小块，避免挡住 App 自己的底部按钮
          - (BOOL)pointInside:(CGPoint)point withEvent:(UIEvent *)event {
              if (!self.captureEnabled) return NO;
              CGRect b = self.bounds;
              CGFloat w = (self.activeWidth > 0.0) ? MIN(self.activeWidth, b.size.width) : b.size.width;
              CGRect active = CGRectMake((b.size.width - w) / 2.0, 0.0, w, b.size.height);
              return CGRectContainsPoint(active, point);
          }

          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              if (self.hidden || self.alpha < 0.01 || !self.userInteractionEnabled) return nil;
              return [self pointInside:point withEvent:event] ? self : nil;
          }

          // 命中诊断：只要摸到了触发层就一定留痕，用来区分「没摸到」和「摸到了但没打开」
          - (void)touchesBegan:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              HBLog(@"touch -> trigger (capture=%d frame=%@ win=%@)",
                    (int)self.captureEnabled,
                    NSStringFromCGRect(self.frame),
                    NSStringFromClass([self.window class]));
              [super touchesBegan:touches withEvent:event];
          }

          @end

          /* ---------------- 独立穿透窗口：捕获面不再依赖宿主视图层级 ---------------- */

          // 一个只吃「底部触发区」的透明窗口。命中之外的点一律返回 nil，
          // 事件会穿透到下面的窗口，因此不会挡住 App 自己的任何操作。
          // 好处：捕获能力不再依赖「宿主 window 里谁在最上层」，
          // 也不再依赖触发层是否可见 —— 视觉与命中彻底解耦。
          @interface HBPassWindow : UIWindow
          @property (nonatomic, weak) HBTriggerView *trigger;
          @end

          @implementation HBPassWindow

          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              if (self.hidden || self.alpha < 0.01 || !self.userInteractionEnabled) return nil;
              HBTriggerView *t = self.trigger;
              if (t && !t.hidden && t.alpha >= 0.01 && t.userInteractionEnabled) {
                  CGPoint p = [self convertPoint:point toView:t];
                  if ([t pointInside:p withEvent:event]) return t;
              }
              return nil;   // 交回给下面的窗口
          }

          @end

          /* ---------------- 纯显示层（不参与命中） ---------------- */
          //
          // 关键拆分：命中层(HBTriggerView) 与 显示层(HBTintView) 必须是两个 view。
          // 之前把颜色/透明度直接改在命中层上，于是「透明度调 0」会把命中层一起
          // 变成透明——真机上就表现为「透明度为 0 时点击没反应」。
          // 现在：命中层永远 clear、无边框、userInteractionEnabled=YES，任何外观设置都不碰它；
          // 颜色/透明度只作用在独立的显示层上，显示层 userInteractionEnabled=NO。

          @interface HBTintView : UIView
          @end

          @implementation HBTintView

          - (instancetype)initWithFrame:(CGRect)frame {
              if ((self = [super initWithFrame:frame])) {
                  self.backgroundColor        = [UIColor clearColor];
                  self.opaque                 = NO;
                  self.userInteractionEnabled = NO;   // 只负责显示，绝不参与命中
              }
              return self;
          }

          // 双保险：即使被系统 hitTest 走到，也不吃掉任何触摸
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event { return nil; }
          - (BOOL)pointInside:(CGPoint)point withEvent:(UIEvent *)event { return NO; }

          @end

          /* ---------------- 触发区几何 ---------------- */
          //
          // 历史教训：曾尝试遍历视图树去「找到小白条本体」，实测三宗罪：
          //   a. 每秒递归遍历 SpringBoard 全部窗口的完整视图树 → 锁屏界面明显卡顿；
          //   b. 类名规则 PillView 命中了 SBHSearchPillView（搜索框胶囊，在屏幕上半部）；
          //   c) 类名规则绕过了几何校验，SBHomeGrabberView 的 bounds 是全屏
          //      → 触发区一度变成 {{0,0},{393,852}}，点哪都触发。
          // 因此本版**彻底放弃视图树扫描**，改用纯几何：底部居中、高度等于底部安全区，
          // 正好落在小白条那一行。零遍历、零卡顿、无误触。

          static CGFloat HBBottomInset(void) {
              @try {
                  for (UIWindow *x in [UIApplication sharedApplication].windows) {
                      if (![x isKindOfClass:[UIWindow class]]) continue;
                      if (!x.isKeyWindow) continue;
                      CGFloat b = x.safeAreaInsets.bottom;
                      if (b > 1.0 && b < 80.0) return b;
                  }
              } @catch (NSException *e) {}
              return 34.0;
          }

          static UIColor *HBOverlayColor(NSString *name) {
              static NSDictionary *map = nil;
              static dispatch_once_t once;
              dispatch_once(&once, ^{
                  map = @{ @"red":    [UIColor redColor],
                           @"orange": [UIColor orangeColor],
                           @"yellow": [UIColor yellowColor],
                           @"green":  [UIColor greenColor],
                           @"cyan":   [UIColor cyanColor],
                           @"blue":   [UIColor blueColor],
                           @"purple": [UIColor purpleColor],
                           @"pink":   [UIColor colorWithRed:1.0 green:0.18 blue:0.51 alpha:1.0],
                           @"white":  [UIColor whiteColor],
                           @"black":  [UIColor blackColor] };
              });
              UIColor *c = name.length ? map[name] : nil;
              return c ?: [UIColor redColor];
          }

          /* ---------------- 管理器 ---------------- */

          @interface HBManager : NSObject
          @property (nonatomic, assign)   BOOL keyboardVisible;
          @property (nonatomic, strong)   NSTimer *timer;
          @property (nonatomic, strong)   HBPassWindow *passWindow;   // 唯一的触发层，全局只有一层
          @property (nonatomic, strong)   HBTintView   *tintView;     // 纯显示层，不参与命中
          @property (nonatomic, assign)   BOOL started;
          @property (nonatomic, strong)   NSString *lastRectDesc;   // 仅在几何变化时打日志
          @property (nonatomic, strong)   NSString *lastStyleDesc;  // 仅在外观变化时打日志
          + (instancetype)shared;
          - (void)start;
          - (void)refresh;
          - (CGRect)triggerRectForBounds:(CGRect)bounds prefs:(NSDictionary *)p;
          - (void)applyTint:(NSDictionary *)p;
          @end

          @implementation HBManager

          + (instancetype)shared {
              static HBManager *m = nil;
              static dispatch_once_t once;
              dispatch_once(&once, ^{ m = [[HBManager alloc] init]; });
              return m;
          }

          - (void)start {
              if (self.started) return;
              self.started = YES;
              self.lastRectDesc = nil;
              self.lastStyleDesc = nil;

              NSString *dir = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              if (dir) gLogPath = [dir stringByAppendingPathComponent:@"HomeBarURL.log"];

              NSDictionary *p0 = HBPrefs();
              gDebug = HBBool(p0, kDbgKey, YES);

              NSNotificationCenter *nc = [NSNotificationCenter defaultCenter];
              [nc addObserver:self selector:@selector(hbKeyboardShow:) name:UIKeyboardWillShowNotification object:nil];
              [nc addObserver:self selector:@selector(hbKeyboardHide:) name:UIKeyboardWillHideNotification object:nil];
              [nc addObserver:self selector:@selector(refresh) name:UIWindowDidBecomeKeyNotification object:nil];
              [nc addObserver:self selector:@selector(refresh) name:UIApplicationDidFinishLaunchingNotification object:nil];
              // 从「设置」切回来时立刻重新读配置，不用等下一次轮询
              [nc addObserver:self selector:@selector(hbActive:) name:UIApplicationDidBecomeActiveNotification object:nil];

              HBLog(@"===== loaded in %@ (iOS %@) =====",
                    [[NSBundle mainBundle] bundleIdentifier] ?: @"(no bundle id)",
                    [[UIDevice currentDevice] systemVersion]);

              // 构建标记：一眼确认真机上跑的到底是哪个版本（防止装到旧包却以为改了没生效）
              HBLog(@"[BUILD STAMP] HomeBarURL 2.0.4 | springboard-only | keys=%@", HBPrefKeys());

              HBSetDiag(kDiagLoad, [NSString stringWithFormat:@"已注入 %@ · iOS %@ · %@",
                                    [[NSBundle mainBundle] bundleIdentifier] ?: @"(无 Bundle ID)",
                                    [[UIDevice currentDevice] systemVersion],
                                    HBTime()]);

              HBLog(@"resolved settings: readable=%d count=%d payload=%@",
                    (int)(p0.count > 0), (int)p0.count, p0);

              // 审计：列出「想读但没读到」的键 —— 这些键会静默回落默认值，是难查 bug 的高发区
              NSMutableArray *missing = [NSMutableArray array];
              for (NSString *k in HBPrefKeys()) {
                  if (!p0[k]) [missing addObject:k];
              }
              HBLog(@"missing keys (will use defaults): %@",
                    missing.count ? [missing componentsJoinedByString:@", "] : @"(none)");

              [self refresh];

              // 2 秒轮询 + CommonModes（默认模式的定时器在滚动/触摸追踪期间不触发）。
              // 1 秒时 CFPreferencesAppSynchronize 的跨进程调用过于频繁，
              // 在锁屏等场景会明显拖慢系统。窗口变化 / 键盘 / 前后台切换都会立即刷新，不依赖轮询。
              self.timer = [NSTimer timerWithTimeInterval:2.0
                                                   target:self
                                                 selector:@selector(refresh)
                                                 userInfo:nil
                                                  repeats:YES];
              [[NSRunLoop mainRunLoop] addTimer:self.timer forMode:NSRunLoopCommonModes];
          }

          - (void)hbKeyboardShow:(NSNotification *)n { self.keyboardVisible = YES;  [self refresh]; }
          - (void)hbKeyboardHide:(NSNotification *)n { self.keyboardVisible = NO;   [self refresh]; }

          // 回到前台时键盘必然已收起。若标记卡在 YES，触发层会被永久禁用 —— 这是历史上
          // 「开关一关功能就没了」这类现象的常见来源之一，这里主动复位。
          - (void)hbActive:(NSNotification *)n {
              if (self.keyboardVisible) {
                  self.keyboardVisible = NO;
                  HBLog(@"keyboardVisible reset on active");
              }
              [self refresh];
          }

          - (void)refresh {
              NSDictionary *p = HBPrefs();
              gDebug = HBBool(p, kDbgKey, YES);

              // 全局只有一层触发区，挂在自建的独立穿透窗口上。
              // 绝不能再往 keyWindow 上挂第二层 —— 那会出现「两层红色半透明」叠在一起。
              [self ensurePassWindow:p];
          }

          // 触发区几何：底部居中，默认正好盖住底部安全区（小白条所在的那一行）
          - (CGRect)triggerRectForBounds:(CGRect)bounds prefs:(NSDictionary *)p {
              CGFloat W = bounds.size.width, H = bounds.size.height;
              if (W < 40.0 || H < 40.0) return CGRectZero;

              CGFloat inset = HBBottomInset();          // 34 = iPhone 14 Pro 底部安全区
              CGFloat h = HBNum(p, kHKey, 0.0);
              if (h <= 1.0) h = MIN(inset, 34.0);        // 0 = 跟随安全区高度
              h = MAX(20.0, MIN(80.0, h));

              CGFloat w = HBNum(p, kWKey, 0.0);
              if (w <= 1.0) w = MIN(MAX(120.0, inset * 4.0), W * 0.5);  // 0 = 默认 150 左右
              w = MAX(60.0, MIN(W, w));

              CGFloat dy = HBNum(p, kDyKey, 0.0);
              dy = MAX(-40.0, MIN(40.0, dy));

              // 关键：小白条画在**底部安全区内部、贴近屏幕下沿**（约 H-13 ~ H-8）。
              // 所以触发区必须**贴底**：y = H - h。若按 H - inset - h 放在安全区上方，
              // 会正好落在小白条上面一点，手指怎么点都点不到。
              CGRect f = CGRectMake(0.0, H - h + dy, w, h);
              f.origin.x    = (W - w) / 2.0;                          // 始终水平居中
              f.size.width  = MIN(w,  W);
              f.size.height = MIN(h,  H);
              f.origin.x    = MAX(0.0, f.origin.x);
              f.origin.y    = MAX(0.0, MIN(f.origin.y, H - f.size.height));
              return CGRectIntegral(f);
          }

          // 外观只作用于**独立的显示层**，绝不碰命中层。
          // 填充透明度与边框透明度各自独立，都可以调到 0.01 这种近乎不可见的值。
          - (void)applyTint:(NSDictionary *)p {
              HBTintView *tv = self.tintView;
              if (!tv) return;

              // 只要配置读得到就以配置为准；读不到时按关闭处理（宁可不显示，也不要恒定色块）
              BOOL show = (p.count > 0) ? HBBool(p, kOvKey, YES) : NO;

              CGFloat op = HBNum(p, kOpKey, 0.30);   // 填充
              op = MAX(0.0, MIN(1.0, op));
              CGFloat opB = HBNum(p, kOpBKey, 0.00);  // 边框
              opB = MAX(0.0, MIN(1.0, opB));

              UIColor *c = HBOverlayColor(HBStr(p, kClKey, @"red"));

              if (show) {
                  // 填充
                  tv.backgroundColor = (op > 0.0) ? [c colorWithAlphaComponent:op] : [UIColor clearColor];
                  // 边框：透明度独立，默认 0.00 = 完全无边框
                  if (opB > 0.0) {
                      tv.layer.borderWidth = 1.0;
                      tv.layer.borderColor = [c colorWithAlphaComponent:opB].CGColor;
                  } else {
                      tv.layer.borderWidth = 0.0;
                      tv.layer.borderColor = nil;
                  }
                  tv.hidden = NO;
              } else {
                  tv.backgroundColor = [UIColor clearColor];
                  tv.layer.borderWidth = 0.0;
                  tv.layer.borderColor = nil;
                  tv.hidden = YES;    // 显示层整层隐藏；命中层完全不受影响
              }

              NSString *desc = [NSString stringWithFormat:@"show=%d fill=%.2f border=%.2f color=%@",
                                (int)show, op, opB, show ? HBStr(p, kClKey, @"red") : @"-"];
              if (![desc isEqualToString:self.lastStyleDesc]) {
                  self.lastStyleDesc = desc;
                  HBLog(@"tint -> %@ (readable=%d raw=%@)", desc, (int)(p.count > 0),
                        p[kOvKey] ? [NSString stringWithFormat:@"%@", p[kOvKey]] : @"(key missing)");
              }
          }

          - (void)ensurePassWindow:(NSDictionary *)p {
              if (self.passWindow) {
                  [self configurePassWindow:self.passWindow prefs:p];
                  return;
              }
              @try {
                  HBPassWindow *w = [[HBPassWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  w.backgroundColor        = [UIColor clearColor];
                  w.opaque                 = NO;
                  w.userInteractionEnabled = YES;
                  w.windowLevel            = UIWindowLevelNormal + 10.0;
                  // iOS 13+ 没有 windowScene 的 UIWindow 不会被显示，必须从已有窗口借用
                  if ([w respondsToSelector:@selector(setWindowScene:)]) {
                      for (UIWindow *x in [UIApplication sharedApplication].windows) {
                          if (x.windowScene) { w.windowScene = x.windowScene; break; }
                      }
                  }
                  HBTriggerView *v = [[HBTriggerView alloc] initWithFrame:CGRectZero];
                  [w addSubview:v];
                  w.trigger    = v;
                  w.hidden     = NO;
                  self.passWindow = w;
                  HBLog(@"pass window created (level %.0f, bounds %@, scene=%@)",
                        w.windowLevel, NSStringFromCGRect(w.bounds),
                        w.windowScene ? @"yes" : @"NIL(可能不显示)");
                  HBSetDiag(kDiagOverlay, [NSString stringWithFormat:@"独立捕获窗口已建立 · %@", HBTime()]);
                  [self configurePassWindow:w prefs:p];
              } @catch (NSException *e) {
                  HBLog(@"pass window failed: %@", e);
              }
          }

          - (void)configurePassWindow:(HBPassWindow *)w prefs:(NSDictionary *)p {
              HBTriggerView *v = w.trigger;
              if (!v) return;

              CGRect wb = w.bounds;
              if (CGRectIsEmpty(wb)) return;

              CGRect f = [self triggerRectForBounds:wb prefs:p];
              if (!CGRectEqualToRect(v.frame, f)) v.frame = f;

              v.activeWidth    = 0.0;   // 整层即命中区，view 本身已经只有小白条那么大
              v.captureEnabled = HBBool(p, kOnKey, YES) && !(HBBool(p, kKbKey, YES) && self.keyboardVisible);

              // 命中层：外观永远不碰它（无边框、背景 clear、始终可命中）
              v.backgroundColor        = [UIColor clearColor];
              v.layer.borderWidth      = 0.0;
              v.layer.borderColor      = nil;
              v.opaque                 = NO;
              v.hidden                 = NO;
              v.alpha                  = 1.0;
              v.userInteractionEnabled = YES;

              // 显示层：独立 view，跟随触发区几何，只负责颜色/透明度
              if (!self.tintView) {
                  self.tintView = [[HBTintView alloc] initWithFrame:f];
                  [w insertSubview:self.tintView belowSubview:v];
              }
              if (!CGRectEqualToRect(self.tintView.frame, f)) self.tintView.frame = f;
              [self applyTint:p];

              [self configure:v prefs:p];
              [w bringSubviewToFront:v];

              NSString *desc = [NSString stringWithFormat:@"%@", NSStringFromCGRect(f)];
              if (![desc isEqualToString:self.lastRectDesc]) {
                  self.lastRectDesc = desc;
                  HBLog(@"trigger rect -> %@ (capture=%d)", NSStringFromCGRect(f), (int)v.captureEnabled);
              }
          }

          - (void)configure:(HBTriggerView *)v prefs:(NSDictionary *)p {
              NSInteger mode = (NSInteger)HBNum(p, kActKey, 0.0);
              if (mode < 0 || mode > 2) mode = 0;
              if (v.modeTag == mode) return;
              v.modeTag = mode;

              for (UIGestureRecognizer *g in [v.gestureRecognizers copy]) {
                  [v removeGestureRecognizer:g];
              }

              if (mode == 2) {
                  UILongPressGestureRecognizer *lp =
                      [[UILongPressGestureRecognizer alloc] initWithTarget:self action:@selector(hbFire:)];
                  lp.minimumPressDuration = 0.35;
                  lp.allowableMovement    = 24.0;
                  lp.cancelsTouchesInView = YES;
                  [v addGestureRecognizer:lp];
              } else {
                  UITapGestureRecognizer *tap =
                      [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(hbFire:)];
                  tap.numberOfTapsRequired    = (mode == 1) ? 2 : 1;
                  tap.numberOfTouchesRequired = 1;
                  tap.cancelsTouchesInView    = YES;
                  [v addGestureRecognizer:tap];
              }
          }

          - (void)hbFire:(UIGestureRecognizer *)g {
              if ([g isKindOfClass:[UILongPressGestureRecognizer class]]) {
                  if (g.state != UIGestureRecognizerStateBegan) return;
              } else if (g.state != UIGestureRecognizerStateRecognized) {
                  return;
              }

              NSTimeInterval now = [[NSDate date] timeIntervalSince1970];
              if (gLastFire && (now - [gLastFire timeIntervalSince1970]) < 0.4) return;
              gLastFire = [NSDate date];

              NSDictionary *p = HBPrefs();
              gDebug = HBBool(p, kDbgKey, YES);

              if (!HBBool(p, kOnKey, YES)) {
                  HBLog(@"trigger ignored (tweak disabled)");
                  return;
              }

              NSString *s = HBStr(p, kURLKey, kDefaultURL);
              NSURL *url = [NSURL URLWithString:s];
              if (!url) {
                  HBLog(@"invalid URL string: %@", s);
                  return;
              }

              HBLog(@"FIRE -> %@", s);

              if (HBBool(p, kHapKey, YES) && NSClassFromString(@"UIImpactFeedbackGenerator")) {
                  @try {
                      UIImpactFeedbackGenerator *gen =
                          [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleLight];
                      [gen prepare];
                      [gen impactOccurred];
                  } @catch (NSException *e) {}
              }

              UIApplication *app = [UIApplication sharedApplication];
              if (!app) return;

              BOOL can = YES;
              @try { can = [app canOpenURL:url]; } @catch (NSException *e) { can = YES; }
              if (!can) HBLog(@"warning: canOpenURL=NO for %@ (scheme 可能未注册)", s);

              HBSetDiag(kDiagFire, [NSString stringWithFormat:@"%@ · %@ · canOpen=%@",
                                    HBTime(), s, can ? @"是" : @"否"]);

              @try {
                  [app openURL:url options:@{} completionHandler:^(BOOL ok) {
                      HBLog(@"openURL %@ -> success=%d", s, (int)ok);
                      HBSetDiag(kDiagFire, [NSString stringWithFormat:@"%@ · %@ · 打开%@",
                                            HBTime(), s, ok ? @"成功" : @"失败"]);
                  }];
              } @catch (NSException *e) {
                  HBLog(@"openURL exception: %@", e);
              }
          }

          @end

          /* ---------------- 注入点 ---------------- */

          %hook UIWindow

          - (void)becomeKeyWindow {
              %orig;
              [[HBManager shared] refresh];
          }

          - (void)makeKeyAndVisible {
              %orig;
              [[HBManager shared] refresh];
          }

          %end

          %ctor {
              @autoreleasepool {
                  // 只进有 Bundle ID 的图形进程，避免注入到链接了 UIKit 的后台守护进程
                  if (![[NSBundle mainBundle] bundleIdentifier]) return;
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.0 * NSEC_PER_SEC)),
                                 dispatch_get_main_queue(), ^{
                      @try { [[HBManager shared] start]; } @catch (NSException *e) {}
                  });
              }
          }
          EOF_TWEAK
          cat > HomeBarURLPrefs/Makefile <<'EOF_PREFMAKE'
          BUNDLE_NAME = HomeBarURLPrefs

          HomeBarURLPrefs_FILES = HomeBarURLPrefs.m
          HomeBarURLPrefs_INSTALL_PATH = /Library/PreferenceBundles
          HomeBarURLPrefs_FRAMEWORKS = UIKit
          HomeBarURLPrefs_PRIVATE_FRAMEWORKS = Preferences
          HomeBarURLPrefs_CFLAGS = -fobjc-arc -Wno-error -Wno-deprecated-declarations

          include $(THEOS)/makefiles/common.mk
          include $(THEOS_MAKE_PATH)/bundle.mk
          EOF_PREFMAKE
          cat > HomeBarURLPrefs/HomeBarURLPrefs.m <<'EOF_PREFM'
          #import <Preferences/PSListController.h>
          #import <Preferences/PSSpecifier.h>
          #import <UIKit/UIKit.h>
          #import <CoreFoundation/CoreFoundation.h>

          static NSString * const HBID    = @"com.yourname.homebarurl";
          static NSString * const kURLKey = @"targetURL";

          // 读插件写回来的遥测值（走 cfprefsd，跨进程可读）
          static NSString *HBReadDiag(NSString *key) {
              CFPreferencesAppSynchronize((__bridge CFStringRef)HBID);
              id v = (__bridge_transfer id)CFPreferencesCopyAppValue((__bridge CFStringRef)key,
                                                                     (__bridge CFStringRef)HBID);
              if (!v) return @"（无记录）";
              if ([v isKindOfClass:[NSString class]]) return (NSString *)v;
              return [NSString stringWithFormat:@"%@", v];
          }

          @interface HomeBarURLPrefsListController : PSListController
          - (void)testOpenURL:(PSSpecifier *)spec;
          - (PSSpecifier *)hbGroup:(NSString *)label footer:(NSString *)footer;
          - (PSSpecifier *)hbSwitch:(NSString *)label key:(NSString *)key def:(BOOL)def;
          - (PSSpecifier *)hbEdit:(NSString *)label key:(NSString *)key def:(NSString *)def ph:(NSString *)ph kb:(int)kb;
          - (PSSpecifier *)hbList:(NSString *)label key:(NSString *)key def:(int)def;
          - (PSSpecifier *)hbButton:(NSString *)label action:(NSString *)action;
          - (void)hbAdd:(NSMutableArray *)a row:(PSSpecifier *)row;
          @end

          @implementation HomeBarURLPrefsListController

          // ---- 逐行构造，每行都先确认 cell 类存在，缺失就跳过，绝不让整页崩掉 ----

          - (void)hbAdd:(NSMutableArray *)a row:(PSSpecifier *)row {
              if (row) { [a addObject:row]; }
              else { NSLog(@"[HomeBarURL] skipped an unsupported row"); }
          }

          - (PSSpecifier *)hbGroup:(NSString *)label footer:(NSString *)footer {
              PSSpecifier *s = [PSSpecifier preferenceSpecifierNamed:label
                                                              target:self set:NULL get:NULL
                                                              detail:Nil cell:PSGroupCell edit:Nil];
              if (footer.length) [s setProperty:footer forKey:@"footerText"];
              return s;
          }

          - (PSSpecifier *)hbSwitch:(NSString *)label key:(NSString *)key def:(BOOL)def {
              if (!NSClassFromString(@"PSSwitchCell")) return nil;
              PSSpecifier *s = [PSSpecifier preferenceSpecifierNamed:label target:self
                                     set:@selector(setPreferenceValue:specifier:)
                                     get:@selector(readPreferenceValue:)
                                   detail:Nil cell:PSSwitchCell edit:Nil];
              [s setProperty:HBID forKey:@"defaults"];
              [s setProperty:key forKey:@"key"];
              [s setProperty:[NSNumber numberWithBool:def] forKey:@"default"];
              return s;
          }

          - (PSSpecifier *)hbEdit:(NSString *)label key:(NSString *)key def:(NSString *)def ph:(NSString *)ph kb:(int)kb {
              if (!NSClassFromString(@"PSEditTextCell")) return nil;
              PSSpecifier *s = [PSSpecifier preferenceSpecifierNamed:label target:self
                                     set:@selector(setPreferenceValue:specifier:)
                                     get:@selector(readPreferenceValue:)
                                   detail:Nil cell:PSEditTextCell edit:Nil];
              [s setProperty:HBID forKey:@"defaults"];
              [s setProperty:key forKey:@"key"];
              [s setProperty:def forKey:@"default"];
              [s setProperty:ph forKey:@"placeholder"];
              [s setProperty:[NSNumber numberWithInt:kb] forKey:@"keyboardType"];
              [s setProperty:[NSNumber numberWithInt:0] forKey:@"autocapitalizationType"];
              [s setProperty:[NSNumber numberWithInt:0] forKey:@"autocorrectionType"];
              return s;
          }

          - (PSSpecifier *)hbList:(NSString *)label key:(NSString *)key def:(int)def {
              if (!NSClassFromString(@"PSLinkListCell")) return nil;
              if (!NSClassFromString(@"PSListItemsController")) return nil;
              PSSpecifier *s = [PSSpecifier preferenceSpecifierNamed:label target:self
                                     set:@selector(setPreferenceValue:specifier:)
                                     get:@selector(readPreferenceValue:)
                                   detail:NSClassFromString(@"PSListItemsController")
                                     cell:PSLinkListCell edit:Nil];
              [s setProperty:HBID forKey:@"defaults"];
              [s setProperty:key forKey:@"key"];
              [s setProperty:[NSNumber numberWithInt:def] forKey:@"default"];
              [s setProperty:@[[NSNumber numberWithInt:0],
                               [NSNumber numberWithInt:1],
                               [NSNumber numberWithInt:2]] forKey:@"validValues"];
              [s setProperty:@[@"单击", @"双击", @"长按 0.35 秒"] forKey:@"validTitles"];
              return s;
          }

          - (PSSpecifier *)hbButton:(NSString *)label action:(NSString *)action {
              if (!NSClassFromString(@"PSButtonCell")) return nil;
              PSSpecifier *s = [PSSpecifier preferenceSpecifierNamed:label
                                                              target:self set:NULL get:NULL
                                                              detail:Nil cell:PSButtonCell edit:Nil];
              [s setProperty:action forKey:@"action"];
              return s;
          }

          - (NSArray *)specifiers {
              NSMutableArray *a = [NSMutableArray array];

              @try {
                  [a addObject:[self hbGroup:@"开关" footer:nil]];
                  [self hbAdd:a row:[self hbSwitch:@"启用" key:@"enabled" def:YES]];

                  [a addObject:[self hbGroup:@"目标"
                                     footer:@"填写完整 URL / Scheme，必须带协议头。保存后立即生效，无需注销。"]];
                  [self hbAdd:a row:[self hbEdit:@"网址" key:@"targetURL"
                                             def:@"taplink://trigger/DA426593-2DD3-4759-B23A-3ADB84B46213"
                                              ph:@"https:// 或 scheme://" kb:3]];

                  [a addObject:[self hbGroup:@"触发方式" footer:nil]];
                  [self hbAdd:a row:[self hbList:@"手势" key:@"activation" def:0]];

                  [a addObject:[self hbGroup:@"触发区域"
                                     footer:@"以屏幕底部居中计算。宽度填 0 = 整条底边。默认 180 × 44pt。"]];
                  [self hbAdd:a row:[self hbEdit:@"宽度" key:@"triggerWidth" def:@"180" ph:@"180（0=全宽）" kb:4]];
                  [self hbAdd:a row:[self hbEdit:@"高度" key:@"triggerHeight" def:@"44" ph:@"44" kb:4]];

                  [a addObject:[self hbGroup:@"细节" footer:nil]];
                  [self hbAdd:a row:[self hbSwitch:@"键盘弹出时禁用" key:@"disableWithKeyboard" def:YES]];
                  [self hbAdd:a row:[self hbSwitch:@"触发时震动反馈" key:@"haptic" def:YES]];
                  [self hbAdd:a row:[self hbSwitch:@"调试日志" key:@"debugEnabled" def:YES]];

                  [a addObject:[self hbGroup:@"测试" footer:nil]];
                  [self hbAdd:a row:[self hbButton:@"立即测试打开" action:@"testOpenURL:"]];

                  NSString *diag = [NSString stringWithFormat:
                      @"注入状态：%@\n"
                      @"触发层　：%@\n"
                      @"小白条　：%@\n"
                      @"最近触发：%@\n\n"
                      @"「注入状态」显示（无记录）= dylib 未被注入；"
                      @"「触发层」显示（无记录）= 已注入但没拿到窗口。",
                      HBReadDiag(@"diagLoad"), HBReadDiag(@"diagOverlay"),
                      HBReadDiag(@"diagHomeBar"), HBReadDiag(@"diagFire")];
                  [a addObject:[self hbGroup:@"诊断" footer:diag]];
              } @catch (NSException *e) {
                  NSLog(@"[HomeBarURL] specifier build error: %@", e);
              }

              NSMutableArray *out = [NSMutableArray array];
              for (id o in a) { if (o) [out addObject:o]; }

              if (out.count == 0) {
                  @try {
                      NSArray *fromPlist = [self loadSpecifiersFromPlistName:@"Root" target:self];
                      if (fromPlist.count) return fromPlist;
                  } @catch (NSException *e) {}
                  return @[[self hbGroup:@"HomeBarURL" footer:@"界面构造失败，但插件本体可能仍在工作。"]];
              }

              return out;
          }

          - (void)viewWillAppear:(BOOL)animated {
              [super viewWillAppear:animated];
              @try {
                  SEL s = NSSelectorFromString(@"reloadSpecifiers");
                  if ([self respondsToSelector:s]) [self performSelector:s];
              } @catch (NSException *e) {}
          }

          // 保证写入的是「系统级」偏好域 /var/mobile/Library/Preferences/<HBID>.plist，
          // 这样 SpringBoard 和任意 App 进程都能读到同一份配置
          - (void)setPreferenceValue:(id)value specifier:(PSSpecifier *)spec {
              @try { [super setPreferenceValue:value specifier:spec]; } @catch (NSException *e) {}

              NSString *key = [spec propertyForKey:@"key"];
              if (key && value) {
                  CFPreferencesSetAppValue((__bridge CFStringRef)key,
                                           (__bridge CFPropertyListRef)value,
                                           (__bridge CFStringRef)HBID);
                  CFPreferencesAppSynchronize((__bridge CFStringRef)HBID);
              }
          }

          - (id)readPreferenceValue:(PSSpecifier *)spec {
              id v = nil;
              @try { v = [super readPreferenceValue:spec]; } @catch (NSException *e) { v = nil; }
              if (v) return v;

              NSString *key = [spec propertyForKey:@"key"];
              if (key) {
                  CFPreferencesAppSynchronize((__bridge CFStringRef)HBID);
                  v = (__bridge_transfer id)CFPreferencesCopyAppValue((__bridge CFStringRef)key,
                                                                     (__bridge CFStringRef)HBID);
              }
              // 兜底：返回 specifier 上声明的默认值，避免开关显示为关
              return v ?: [spec propertyForKey:@"default"];
          }

          - (void)testOpenURL:(PSSpecifier *)spec {
              CFPreferencesAppSynchronize((__bridge CFStringRef)HBID);
              NSString *s = (__bridge_transfer NSString *)CFPreferencesCopyAppValue((__bridge CFStringRef)kURLKey,
                                                                                    (__bridge CFStringRef)HBID);
              if (![s isKindOfClass:[NSString class]] || s.length == 0) {
                  s = @"taplink://trigger/DA426593-2DD3-4759-B23A-3ADB84B46213";
              }
              NSURL *u = [NSURL URLWithString:s];
              if (!u) return;
              [[UIApplication sharedApplication] openURL:u
                                                 options:@{}
                                       completionHandler:^(BOOL ok) {
                  NSLog(@"[HomeBarURL] test open %@ -> %d", s, (int)ok);
              }];
          }

          @end
          EOF_PREFM
          cat > HomeBarURLPrefs/Resources/Root.plist <<'EOF_ROOT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>title</key>
