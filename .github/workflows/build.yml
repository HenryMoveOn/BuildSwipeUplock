name: Build LockSwipe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (roothide)
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Generate tweak project
        run: |
          mkdir -p LockSwipe
          cd LockSwipe
          cat > Makefile <<'EOF_MAKEFILE'
          TARGET := iphone:clang:16.5:14.0
          ARCHS = arm64e
          THEOS_PACKAGE_SCHEME = roothide

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = LockSwipe
          LockSwipe_FILES = Tweak.x
          LockSwipe_CFLAGS = -fobjc-arc
          LockSwipe_FRAMEWORKS = UIKit Foundation

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF_MAKEFILE
          cat > control <<'EOF_CONTROL'
          Package: com.lockswipe.tweak
          Name: LockSwipe
          Version: 1.0.0
          Architecture: iphoneos-arm64e
          Description: Swipe up the home bar on the Home Screen or Lock Screen to lock the device. In-app behaviour is untouched.
          Maintainer: LockSwipe
          Author: LockSwipe
          Section: Tweaks
          Depends: mobilesubstrate
          EOF_CONTROL
          cat > LockSwipe.plist <<'EOF_PLIST'
          {
              Filter = {
                  Bundles = ( "com.apple.springboard" );
              };
          }
          EOF_PLIST
          cat > Tweak.x <<'EOF_TWEAK'
          // LockSwipe - Home Screen / Lock Screen: swipe up on home bar => lock.
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          @interface SBLockScreenManager : NSObject
          + (instancetype)sharedInstance;
          - (BOOL)isUILocked;
          - (void)lockUI;
          - (void)lockUIFromSource:(int)source withOptions:(id)options;
          @end

          @interface SBMainWorkspace : NSObject
          + (instancetype)sharedInstance;
          - (BOOL)isSpringBoardActive;
          @end

          static BOOL SB_IsLocked(void) {
              Class c = objc_getClass("SBLockScreenManager");
              if (!c) return NO;
              id m = ((id (*)(id, SEL))objc_msgSend)(c, @selector(sharedInstance));
              SEL s = NSSelectorFromString(@"isUILocked");
              if (m && [m respondsToSelector:s]) {
                  return ((BOOL (*)(id, SEL))objc_msgSend)(m, s);
              }
              return NO;
          }

          static BOOL SB_IsHomeScreenActive(void) {
              Class c = objc_getClass("SBMainWorkspace");
              if (!c) return NO;
              id w = ((id (*)(id, SEL))objc_msgSend)(c, @selector(sharedInstance));
              SEL s = NSSelectorFromString(@"isSpringBoardActive");
              if (w && [w respondsToSelector:s]) {
                  return ((BOOL (*)(id, SEL))objc_msgSend)(w, s);
              }
              return NO;
          }

          static void SB_Lock(void) {
              Class c = objc_getClass("SBLockScreenManager");
              if (!c) return;
              id m = ((id (*)(id, SEL))objc_msgSend)(c, @selector(sharedInstance));
              if (!m) return;
              SEL s = NSSelectorFromString(@"lockUIFromSource:withOptions:");
              if ([m respondsToSelector:s]) {
                  ((void (*)(id, SEL, int, id))objc_msgSend)(m, s, 1, nil);
                  NSLog(@"[LockSwipe] locked via lockUIFromSource");
              } else if ([m respondsToSelector:NSSelectorFromString(@"lockUI")]) {
                  ((void (*)(id, SEL))objc_msgSend)(m, NSSelectorFromString(@"lockUI"));
                  NSLog(@"[LockSwipe] locked via lockUI");
              } else {
                  NSLog(@"[LockSwipe] no lock method available");
              }
          }

          static BOOL gIntercept = NO;

          %hook SBFluidSwitcherGestureManager

          - (void)fluidSwitcherGestureTransaction:(id)t didBeginGesture:(id)g {
              gIntercept = (SB_IsHomeScreenActive() || SB_IsLocked());
              NSLog(@"[LockSwipe] begin intercept=%d", gIntercept);
              %orig;
          }

          - (void)fluidSwitcherGestureTransaction:(id)t didUpdateGesture:(id)g {
              if (gIntercept) return;
              %orig;
          }

          - (void)fluidSwitcherGestureTransaction:(id)t didEndGesture:(id)g {
              if (gIntercept) {
                  gIntercept = NO;
                  SB_Lock();
                  return;
              }
              %orig;
          }

          %end
          EOF_TWEAK

      - name: Build deb
        run: |
          cd LockSwipe
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LockSwipe-deb
          path: LockSwipe/packages/*.deb

      - name: Publish release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: LockSwipe build ${{ github.run_number }}
          files: LockSwipe/packages/*.deb
