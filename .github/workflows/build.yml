name: Build HomeBarURL DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libplist-utils curl git xz-utils

      - name: 部署 Theos（含 RootHide 支持）
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # 集成 RootHide 编译方案
          git clone https://github.com/roothide/theos.git /tmp/roothide-theos
          cp -rf /tmp/roothide-theos/* $THEOS/

      - name: 配置 iOS 16.4 SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -L "https://github.com/theos/sdks/releases/download/2024-02/iPhoneOS16.4.sdk.tar.xz" -o sdk.tar.xz
          tar -xf sdk.tar.xz -C $THEOS/sdks/

      - name: 编译生成 DEB 包
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: HomeBarURL-RootHide
          path: packages/*.deb
