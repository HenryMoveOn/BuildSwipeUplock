name: Build HomeBarURL DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            libplist-utils \
            libxml2-dev \
            libssl-dev \
            curl \
            git \
            xz-utils \
            ldid

      - name: 安装官方最新 Theos（原生支持 RootHide）
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: 下载 iOS 16.4 SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -fL "https://github.com/theos/sdks/releases/download/2024-09/iPhoneOS16.4.sdk.tar.xz" -o $THEOS/sdks/iPhoneOS16.4.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.4.sdk.tar.xz -C $THEOS/sdks/
          rm $THEOS/sdks/iPhoneOS16.4.sdk.tar.xz

      - name: 编译 DEB 安装包
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: HomeBarURL-RootHide
          path: packages/*.deb
